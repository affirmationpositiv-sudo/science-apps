let currentQuestion = 0;
const scores = {};
for (const key of Object.keys(QUIZ.results)) scores[key] = 0;

function renderQuestion() {
  const q = QUIZ.questions[currentQuestion];
  const total = QUIZ.questions.length;
  
  document.getElementById('progressFill').style.width = ((currentQuestion + 1) / total * 100) + '%';
  document.getElementById('progressText').textContent = `Frage ${currentQuestion + 1} von ${total}`;
  
  const card = document.getElementById('quizCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeIn .3s ease';
  
  card.innerHTML = `
    <span class="tag">Frage ${currentQuestion + 1}</span>
    <h2>${q.q}</h2>
    <p>Wähle die Antwort, die am besten zu dir passt.</p>
    <div class="options">
      ${q.options.map((opt, i) => `
        <button class="option" data-id="${opt.id}" onclick="selectOption(this)">
          ${opt.text}
        </button>
      `).join('')}
    </div>
  `;
}

function selectOption(el) {
  // Remove selection from siblings
  el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  
  // Find the answer data
  const q = QUIZ.questions[currentQuestion];
  const opt = q.options.find(o => o.id === el.dataset.id);
  
  // Add points
  for (const [key, val] of Object.entries(opt.points)) {
    if (scores[key] !== undefined) scores[key] += val;
  }
  
  currentQuestion++;
  if (currentQuestion < QUIZ.questions.length) {
    setTimeout(renderQuestion, 200);
  } else {
    setTimeout(showResult, 300);
  }
}

function showResult() {
  document.getElementById('quizCard').classList.add('hidden');
  
  // Find the winner
  let winner = null;
  let maxScore = -1;
  for (const [key, val] of Object.entries(scores)) {
    if (val > maxScore) { maxScore = val; winner = key; }
  }
  
  const r = QUIZ.results[winner];
  const card = document.getElementById('resultCard');
  card.classList.add('visible');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeIn .4s ease';
  
  const shareUrl = encodeURIComponent('https://affirmationpositiv-sudo.github.io/science-apps/quiz/');
  const shareText = encodeURIComponent(`🤖 Ich habe "${r.name}" im KI-Quiz 2026 bekommen! Welches KI-Tool passt zu dir?`);
  
  card.innerHTML = `
    <div class="result-header">
      <span class="emoji">${r.emoji}</span>
      <h2>${r.name}</h2>
      <p>${r.desc}</p>
    </div>
    <div class="result-detail">
      <h3>🎯 Warum dieses Tool?</h3>
      <p>${r.why}</p>
    </div>
    <a class="affiliate-link" href="${r.amazonLink}" target="_blank" rel="nofollow">${r.amazonLabel}</a>
    <div class="tip-box">
      <strong>💡 Profi-Tipps für ${r.name}:</strong>
      <ul style="margin-top:8px;list-style:none">
        ${r.tips.map(t => `<li style="padding:4px 0">→ ${t}</li>`).join('')}
      </ul>
    </div>
    <div class="cta-section">
      <h3>🚀 Bereit für mehr?</h3>
      <p>Entdecke alle KI-Tools und Affiliate-Angebote auf dem Portal</p>
      <a class="cta-btn" href="../GalaxyBlog/" target="_blank">Zum GalaxyBlog →</a>
    </div>
    <div class="social-share">
      <a class="share-twitter" href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener">🐦 Twitter/X</a>
      <a class="share-linkedin" href="https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}" target="_blank" rel="noopener">💼 LinkedIn</a>
      <a class="share-whatsapp" href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" rel="noopener">💬 WhatsApp</a>
    </div>
    <button class="reset-btn" onclick="resetQuiz()">🔄 Quiz wiederholen</button>
    <p style="text-align:center;margin-top:12px;font-size:11px;color:var(--text-muted)">Als Amazon-Partner verdiene ich an qualifizierten Verkäufen. #Werbung</p>
  `;
}

function resetQuiz() {
  currentQuestion = 0;
  for (const key of Object.keys(scores)) scores[key] = 0;
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('resultCard').innerHTML = '';
  document.getElementById('quizCard').classList.remove('hidden');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = 'Frage 1 von 5';
  renderQuestion();
}

renderQuestion();
