    if (drone === "video" || drone === "beides") accs = accs.concat([{name:"DJI RS 4 Pro Gimbal",price:"ca. 900 €",rating:"4.8/5",url:"https://www.amazon.de/s?k=DJI+RS+4+Pro&tag=ikune21-21"}]);
    budgetTotal = 8000;
    plan = [
      {day:1,title:"Profi-Planung",desc:"Shooting-Konzept + benötigtes Equipment listen"},
      {day:2,title:"Equipment-Check",desc:"Alle Komponenten testen: Kameras, Objektive, Lichter"},
      {day:3,title:"KI-Workflow optimieren",desc":"Lightroom-Presets, Topaz-Stapelverarbeitung, Backup-Routine"},
      {day:4,title:"Drohnen-Training",desc:"Luftaufnahmen planen und Flugrouten üben"},
      {day:5,title:"Großes Shooting",desc":"Kund*innen-Shooting mit gesamtem Equipment"},
      {day:6,title:"Post-Production",desc":"Bilder sortieren, KI-Bearbeitung, Kunden-Edit"},
      {day:7,title:"Abrechnung & Portfolio",desc":"Ergebnisse präsentieren, Portfolio aktualisieren, nächste Projekte planen"}
    ];
  }

  return {profileEmoji,profileTitle,profileDesc,cam,phone,lens,edit,droneGear,accs,kiGen,budgetTotal,plan};
}

// ===== RENDER =====
let currentStep = 0;
const answers = {};

function renderStep(step) {
  const q = questions[step];
  if (!q) { showResult(); return; }

  const container = document.getElementById("quizContainer");
  document.getElementById("resultContainer").style.display = "none";

  let html = `<div class="step active"><div class="question-card"><h2><span class="num">${q.icon}</span> ${q.question}</h2><div class="options">`;
  q.options.forEach(o => {
    const selected = answers[q.id] === o.value ? "selected" : "";
    html += `<div class="option ${selected}" onclick="selectOption('${q.id}','${o.value}')"><div class="icon">${o.icon}</div><div><div class="label">${o.label}</div><div class="desc">${o.desc}</div></div></div>`;
  });
  html += `</div></div><div class="nav-buttons">`;
  if (step > 0) html += `<button class="btn" onclick="goToStep(${step-1})">← Zurück</button>`;
  else html += `<button class="btn" disabled>← Zurück</button>`;
  const hasAnswer = !!answers[q.id];
  const nextLabel = step < questions.length-1 ? "Weiter →" : "🔍 Auswertung starten";
  html += `<button class="btn btn-primary" onclick="nextStep()" ${hasAnswer?"":"disabled"}>${nextLabel}</button>`;
  html += `</div></div>`;

  container.innerHTML = html;
  container.style.display = "block";
  document.getElementById("progressBar").style.width = ((step+1)/questions.length*100)+"%";
  document.getElementById("stepLabel").textContent = `Frage ${step+1} von ${questions.length}`;
}

function selectOption(qId, value) {
  answers[qId] = value;
  const options = document.querySelectorAll(".option");
  options.forEach(o => o.classList.remove("selected"));
  event.currentTarget.classList.add("selected");
  document.querySelector(".btn-primary").disabled = false;
}

function nextStep() {
  const q = questions[currentStep];
  if (!answers[q.id]) return;
  currentStep++;
  if (currentStep >= questions.length) showResult();
  else renderStep(currentStep);
}

function goToStep(step) {
  currentStep = step;
  renderStep(step);
}

function showResult() {
  document.getElementById("quizContainer").style.display = "none";
  document.getElementById("resultContainer").style.display = "block";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("stepLabel").textContent = "✅ Auswertung abgeschlossen";

  const profile = generateProfile(answers);
  let html = `<div class="result-card"><div class="profile">${profile.profileEmoji}</div><h2>${profile.profileTitle}</h2><p class="summary">${profile.profileDesc}</p>`;

  // Kameras
  if (profile.cam && profile.cam.length) {
    html += `<div class="product-section"><h3>📷 Empfohlene Kameras</h3><div class="product-grid">`;

      html += `<div class="product-item"><div class="info"><div class="name">${p.name}</div><div class="price">${p.price} · ${p.rating}</div></div><a href="${p.url}" target="_blank" class="link">🔗 Preise</a></div>`;
    });
    html += `</div></div>`;
  }

  // Smartphone
  if (profile.phone && profile.phone.length) {
    html += `<div class="product-section"><h3>📱 Empfohlene Smartphones</h3><div class="product-grid">`;
    profile.phone.forEach(p => {
      html += `<div class="product-item"><div class="info"><div class="name">${p.name}</div><div class="price">${p.price} · ${p.rating}</div></div><a href="${p.url}" target="_blank" class="link">🔗 Preise</a></div>`;
    });
    html += `</div></div>`;
  }

  // Objektive

    profile.lens.forEach(p => {

    });
    html += `</div></div>`;
  }

  // KI-Bearbeitung
  if (profile.edit && profile.edit.length) {
    html += `<div class="product-section"><h3>🎨 KI-Fotobearbeitung</h3><div class="product-grid">`;
    profile.edit.forEach(p => {
      html += `<div class="product-item"><div class="info"><div class="name">${p.name}</div><div class="price">${p.price} · ${p.rating}</div></div><a href="${p.url}" target="_blank" class="link">🔗 Preise</a></div>`;
    });
    html += `</div></div>`;
  }

  // KI-Generatoren
  if (profile.kiGen && profile.kiGen.length) {
    html += `<div class="product-section"><h3>✨ KI-Bildgeneratoren (Text zu Bild)</h3><div class="product-grid">`;
    profile.kiGen.forEach(p => {
      html += `<div class="product-item"><div class="info"><div class="name">${p.name}</div><div class="price">${p.price} · ${p.rating}</div></div><a href="${p.url}" target="_blank" class="link">🔗 Preise</a></div>`;
    });
    html += `</div></div>`;
  }

  // Drohnen
  if (profile.droneGear && profile.droneGear.length) {
    html += `<div class="product-section"><h3>🚁 KI-Drohnen</h3><div class="product-grid">`;
    profile.droneGear.forEach(p => {
      html += `<div class="product-item"><div class="info"><div class="name">${p.name}</div><div class="price">${p.price} · ${p.rating}</div></div><a href="${p.url}" target="_blank" class="link">🔗 Preise</a></div>`;
    });
    html += `</div></div>`;
  }

  // Zubehör
  if (profile.accs && profile.accs.length) {
    html += `<div class="product-section"><h3>🔧 Empfohlenes Zubehör</h3><div class="product-grid">`;
    profile.accs.forEach(p => {
      html += `<div class="product-item"><div class="info"><div class="name">${p.name}</div><div class="price">${p.price} · ${p.rating}</div></div><a href="${p.url}" target="_blank" class="link">🔗 Preise</a></div>`;
    });
    html += `</div></div>`;
  }

  // Budget-Bereich
  if (profile.budgetTotal) {
    html += `<div class="budget-section"><h3>💰 Geschätzte Gesamtinvestition</h3>`;
    html += `<p style="color:#9CA3AF;font-size:0.9rem;margin-bottom:10px;">Richtwert für Kamera + 1 Objektiv + Basis-Zubehör + Software:</p>`;
    html += `<div class="budget-item"><span>Start-Investment</span><span class="total">ca. ${profile.budgetTotal.toLocaleString('de-DE')} €</span></div>`;
    html += `<div class="budget-item"><span>Erweiterung (Drohne, zusätzliche Objektive)</span><span class="total">+500–3.000 €</span></div>`;
    html += `<div class="budget-item" style="border-bottom:2px solid #FFD700"><span>Potenzielle Gesamtkosten</span><span class="total">${(profile.budgetTotal+2500).toLocaleString('de-DE')} €</span></div>`;
    html += `<p style="color:#6B7280;font-size:0.8rem;margin-top:10px;">Tipp: Starte mit Kamera + Objektiv und erweitere nach und nach.</p></div>`;
  }

  // 7-Day Plan
  if (profile.plan && profile.plan.length) {
    html += `<div class="budget-section" style="border-color:#8B5CF6;"><h3>📅 7-Tage-Aktionsplan</h3>`;
    profile.plan.forEach(p => {
      html += `<div class="plan-box"><h4>Tag ${p.day}: ${p.title}</h4><p>${p.desc}</p></div>`;
    });
    html += `</div>`;
  }

  // CTA
  html += `<a href="https://www.amazon.de/s?tag=ikune21-21" target="_blank" class="action-cta">🛒 Alle Produkte bei Amazon entdecken (tag=ikune21-21)</a>`;
  html += `<a href="../blog/ki-fotografie-kamera-zubehoer-2026.html" style="display:block;text-align:center;color:#A78BFA;margin:12px 0;">📖 Zum ausführlichen Ratgeber-Artikel</a>`;
  html += `<button class="reset-btn" onclick="resetQuiz()">🔄 Neustarten</button>`;

  document.getElementById("resultContainer").innerHTML = html;
  // Scroll to top
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetQuiz() {
  currentStep = 0;
  for (let key in answers) delete answers[key];
  document.getElementById("resultContainer").style.display = "none";
  document.getElementById("quizContainer").style.display = "block";
  renderStep(0);
}

// ===== START =====
renderStep(0);
</script>
