<!DOCTYPE html>
<html>
<head>
  <!--
    Google Site Verification – Meta-Tag
    Ersetze "VERIFICATION_CODE" durch den Code aus der Google Search Console.
    Füge dieses <meta>-Tag in den <head> jeder Seite ein (z. B. in die
    globale header.html / _includes/head.html).

    Alternativ: Lade diese Datei als googleVERIFICATION_CODE.html hoch
    (Dateiname = genauer Code aus der Search Console).
  -->
  <meta name="google-site-verification" content="VERIFICATION_CODE" />
  <title>Google Site Verification</title>
</head>
<body>
  <p>Google Site Verification – science-apps</p>
  <p>Ersetze "VERIFICATION_CODE" in der meta-tag content-Attribut oder
     benenne diese Datei in <code>googleVERIFICATION_CODE.html</code> um.</p>
</body>
</html>
