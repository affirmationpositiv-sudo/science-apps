let current=0, scores=[0,0,0,0], answers=[];

function init(){document.getElementById('quiz').classList.remove('hidden');document.getElementById('result').classList.add('hidden');current=0;scores=[0,0,0,0];answers=[];renderQuestion();renderDots()}
function renderDots(){let h='';for(let i=0;i<questions.length;i++)h+=`<span class="step-dot${i===current?' active':i<current?' done':''}">`;document.getElementById('stepDots').innerHTML=h}
function renderQuestion(){let q=questions[current];document.getElementById('qLabel').textContent=`Frage ${current+1}/${questions.length}`;document.getElementById('qText').textContent=q.q;document.getElementById('progress').style.width=((current/questions.length)*100)+'%';let h='';q.opts.forEach((o,i)=>{h+=`<button class="option-btn" onclick="select(${i})"><span class="emoji">${o.e}</span>${o.t}</button>`});document.getElementById('options').innerHTML=h}
function select(i){let o=questions[current].opts[i];for(let j=0;j<o.s.length;j++)scores[j]+=o.s[j];answers.push({q:questions[current].q,a:o.t});if(current<questions.length-1){current++;renderQuestion();renderDots()}else showResult()}
function showResult(){document.getElementById('quiz').classList.add('hidden');let best=0;for(let i=1;i<4;i++)if(scores[i]>scores[best])best=i;let p=profiles[best];let h=`<span class="result-emoji">${p.emoji}</span><div class="match-score">🎯 ${Math.round(scores[best]/Math.max(...scores)*100)}% Match</div><h2>${p.name}</h2><p class="result-desc">${p.desc}</p><p style="color:#64748b;font-size:14px;margin-bottom:8px">Perfekte Märkte: ${p.match}</p><div class="recommendations"><p style="color:#a855f7;font-size:14px;font-weight:600;margin-bottom:8px">🎁 Empfohlene Produkte für dich:</p>`;p.products.forEach(pr=>{h+=`<a href="${pr.u}" target="_blank" rel="noopener" class="rec-card"><div class="rec-info"><h4>${pr.n}</h4><div style="color:#94a3b8;font-size:13px;margin-top:4px">${pr.d}</div></div><div style="display:flex;align-items:center;gap:12px"><span class="rec-price">${pr.p}</span><span class="rec-cta">Kaufen →</span></div></a>`});h+=`</div><button class="restart-btn" onclick="init()">🔄 Test wiederholen</button><div style="margin-top:30px;padding:20px;background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.15);border-radius:12px;text-align:left"><p style="color:#f59e0b;font-size:13px;font-weight:600;margin-bottom:8px">📋 Deine Antworten:</p>${answers.map((a,i)=>`<p style="color:#94a3b8;font-size:13px;margin:4px 0">${i+1}. <span style="color:#64748b">${a.q}</span> → <strong style="color:#e2e8f0">${a.a}</strong></p>`).join('')}</div>`;document.getElementById('result').innerHTML=h;document.getElementById('result').classList.remove('hidden');document.getElementById('result').classList.add('fade-up')}
